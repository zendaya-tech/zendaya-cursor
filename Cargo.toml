[package]
name = "zendaya-cursor"
version = "0.2.0"
edition = "2024"
description = "Native cursor themes and desktop effects for Windows"
license = "MIT"
repository = "https://github.com/zendaya-tech/zendaya-cursor"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit", "persistence", "links"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
# Reduce debug-build disk and memory use for this executable.
[profile.dev.package.zendaya-cursor]
debug = 0
[profile.release]
lto = "thin"
strip = true
